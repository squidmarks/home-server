# Single sign-on for every app under the domain (see README "access/"):
#   sso     oauth2-proxy: Google sign-in for *.<domain>, cookie on .<domain>,
#           callback at https://auth.<domain>/oauth2/callback. Admits only the
#           emails in data/sso-emails.txt (written by `access`).
#   access  who may use which app (rules in Mongo db "access"), Caddy's
#           forward_auth target, and the admin page at access.<domain>.
# Caddy's `gate` snippet asks both, in that order, for every gated app.
#
# Settings in a gitignored access/.env (compose reads it automatically):
#   DOMAIN=                      the domain (same as caddy/.env)
#   GOOGLE_CLIENT_ID=            a Google OAuth client with
#   GOOGLE_CLIENT_SECRET=          https://auth.<domain>/oauth2/callback as a redirect URI
#   OAUTH2_PROXY_COOKIE_SECRET=  32 random bytes, base64url
#   OWNER_EMAILS=                comma-separated; may use every app, incl. the admin page
#   ACCESS_DB_PASSWORD=          for the Mongo user `access` (access/mongo-user.sh)
# Run from ~/infra/access:  ./mongo-user.sh && docker compose up -d --build
name: access

services:
  access:
    build: .
    image: access:latest
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:3600:3600"
    networks: [default, platform]
    environment:
      DOMAIN: ${DOMAIN}
      OWNER_EMAILS: ${OWNER_EMAILS}
      MONGO_URI: mongodb://access:${ACCESS_DB_PASSWORD}@mongo:27017/access?authSource=access
      SSO_EMAILS_FILE: /data/sso-emails.txt
    volumes:
      - ./data:/data

  sso:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "127.0.0.1:4182:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_NAME: _sso
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Only emails `access` lists anywhere may sign in. Never add EMAIL_DOMAIN
      # "*": it overrides the file and admits any Google account.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /data/sso-emails.txt
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # The directory, not the file: `access` replaces it atomically (new inode).
      - ./data:/data:ro
    depends_on: [access]

networks:
  platform:
    external: true
