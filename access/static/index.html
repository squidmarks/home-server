<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Access</title>
  <style>
    :root {
      --bg: #f3f6f7; --card: #fff; --text: #0f2530; --muted: #5b6f78; --line: #dde5e8;
      --accent: #0e8fb0; --accent-ink: #fff; --bad: #c4401f; --chip: #eef3f5;
      --shadow: 0 1px 2px rgba(15,37,48,.06), 0 4px 16px rgba(15,37,48,.06);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1d26; --card: #12303d; --text: #e8f2f5; --muted: #93adb7; --line: #21404d;
        --accent: #38b6d6; --accent-ink: #062029; --bad: #ff8a6b; --chip: #1a3c4a; --shadow: none; color-scheme: dark; }
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { max-width: 760px; margin: 0 auto; padding: 20px 16px 4px; }
    .crumb { display: inline-block; color: var(--accent); text-decoration: none; font-size: 14px; margin-bottom: 6px; }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
    main { max-width: 760px; margin: 0 auto; padding: 8px 16px 32px; display: grid; gap: 12px; }
    .card { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .head h2 { margin: 0; font-size: 17px; }
    .head a { color: var(--accent); font-size: 14px; text-decoration: none; }
    .desc { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px;
      padding: 4px 6px 4px 12px; font-size: 14px; }
    .chip.owner { padding-right: 12px; color: var(--muted); }
    .chip button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
      width: 22px; height: 22px; border-radius: 50%; }
    .chip button:hover { background: var(--line); color: var(--bad); }
    form.add { display: flex; gap: 8px; margin-top: 10px; }
    form.add input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer;
      background: var(--accent); color: var(--accent-ink); }
    .btn.plain { background: var(--card); color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: var(--bad); color: #fff; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 120px); transition: transform .25s;
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; }
    .toast.show { transform: translate(-50%, 0); }
    .toast.bad { background: var(--bad); color: #fff; }
    dialog { border: 0; border-radius: 16px; padding: 20px; width: min(360px, calc(100vw - 32px));
      background: var(--card); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(6,20,27,.45); }
    dialog h3 { margin: 0 0 6px; font-size: 18px; }
    dialog p { margin: 0; color: var(--muted); }
    .dbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <a class="crumb" id="home" href="/">← Home</a>
    <h1>Access</h1>
    <p class="sub" id="who">Loading…</p>
  </header>
  <main id="apps"></main>

  <dialog id="confirm">
    <form method="dialog">
      <h3 id="cTitle"></h3><p id="cMsg"></p>
      <div class="dbtns"><button value="no" class="btn plain">Cancel</button><button value="yes" class="btn danger">Remove</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>

  <script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  let data = null;

  function toast(msg, bad = false) {
    const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = "toast"), 2400);
  }
  function confirmRemove(title, msg) {
    const d = $("confirm"); $("cTitle").textContent = title; $("cMsg").textContent = msg; d.returnValue = "no";
    return new Promise((res) => { d.addEventListener("close", () => res(d.returnValue === "yes"), { once: true }); d.showModal(); });
  }
  async function api(method, url, body) {
    const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail; } catch {} throw new Error(m); }
    return r.json();
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function render() {
    $("home").href = `https://${data.domain}/`;
    $("who").textContent = `Signed in as ${data.me}. Owners (${data.owners.join(", ")}) can use every app; add anyone else per app below.`;
    const box = $("apps"); box.innerHTML = "";
    for (const a of data.apps) {
      const card = el("section", "card");
      const head = el("div", "head");
      head.appendChild(el("h2", null, a.name));
      if (a.sub) { const l = el("a", null, `${a.sub}.${data.domain} ↗`); l.href = `https://${a.sub}.${data.domain}/`; l.target = "_blank"; head.appendChild(l); }
      else if (a.id === "home") { const l = el("a", null, `${data.domain} ↗`); l.href = `https://${data.domain}/`; l.target = "_blank"; head.appendChild(l); }
      card.appendChild(head);
      card.appendChild(el("p", "desc", a.description || " "));
      const chips = el("div", "chips");
      for (const o of data.owners) chips.appendChild(el("span", "chip owner", `${o} · owner`));
      for (const e of a.emails) {
        const c = el("span", "chip", e);
        const x = el("button", null, "×"); x.title = `Remove ${e}`; x.setAttribute("aria-label", `Remove ${e}`);
        x.onclick = async () => {
          if (!(await confirmRemove(`Remove ${e}?`, `They'll lose access to ${a.name} straight away.`))) return;
          try { await api("DELETE", `/api/apps/${a.id}/emails/${encodeURIComponent(e)}`); toast(`Removed from ${a.name}`); load(); }
          catch (err) { toast(err.message, true); }
        };
        c.appendChild(x); chips.appendChild(c);
      }
      card.appendChild(chips);
      const f = el("form", "add");
      const inp = el("input"); inp.type = "email"; inp.placeholder = "Add an email address"; inp.autocomplete = "off"; inp.required = true;
      const b = el("button", "btn", "Add"); b.type = "submit";
      f.append(inp, b);
      f.onsubmit = async (ev) => {
        ev.preventDefault();
        try { await api("POST", `/api/apps/${a.id}/emails`, { email: inp.value }); toast(`Added to ${a.name}`); load(); }
        catch (err) { toast(err.message, true); }
      };
      card.appendChild(f);
      box.appendChild(card);
    }
  }
  async function load() {
    try { data = await api("GET", "/api/apps"); render(); }
    catch (e) { $("who").textContent = e.message; }
  }
  load();
  </script>
</body>
</html>
