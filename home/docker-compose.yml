# The tailnet home page, hosted on the `home` box: links to every service on
# every box (see services.<hostname>.json). Run from ~/infra/home:  docker compose up -d
# Host networking so it can check each local service on 127.0.0.1; it listens only
# on 127.0.0.1:3090 and is published to the tailnet by tailscale/serve.sh (:443).
services:
  home:
    image: node:22-slim
    container_name: home
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "3090"
      HOST: "127.0.0.1"
      # The tailnet name, for links to ports that `tailscale serve` publishes
      # (see server.mjs). Set it in a gitignored home/.env -- compose reads that
      # automatically -- rather than committing it: it identifies a private
      # network. Unset just leaves those links blank.
      TAILNET_FQDN: ${TAILNET_FQDN:-}
    volumes:
      - ./:/app:ro
    mem_limit: 128m
