# The runtime of the `investment` bench studio (ADR-0020; defined in agent-studio
# scripts/bench/studios/investment.json, which names this file). bench/bench-dev.sh
# starts it once per (model, condition) group on its own database (benchmark_run)
# and resets that database to a post-startup snapshot before every case. The
# Investment Studio exists only for benchmarking; the paper account is the bench's.
name: benchmark-run

services:
  agent-service-run:
    # The shared agent-service image (studios/home.yml): it carries the
    # benchmark engine, and the bench measures the code the studios run.
    image: ${BENCH_IMAGE:-studios-agent-service:latest}
    container_name: agent-service-run
    restart: "no"
    mem_limit: 2g
    ports:
      - "127.0.0.1:3511:3001"
    networks: [platform]
    environment:
      NODE_ENV: production
      AGENT_SERVICE_PORT: "3001"
      LOG_LEVEL: info
      PROFILES: "@agent-studio/benchmark-engine"
      DEFAULT_MODEL: ${BENCH_MODEL}
      ROUTER_MODEL: ${BENCH_MODEL}
      # llama.cpp on 8090 by default; the radiance/vLLM stack serves on 8080.
      # Only one can hold the card at a time, so this selects which is in play.
      # The shim (8091), not llama.cpp direct (8090): one metrics shape for
      # either engine, per-request energy, and a clear refusal when the model
      # asked for is not the one loaded on the card.
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:?set by bench-dev.sh from env.sh SHIM_BASE_URL}
      # Per-request thinking settings for the local model (JSON), set per run by bench-dev.sh.
      LOCAL_LLM_CHAT_TEMPLATE_KWARGS: ${LOCAL_LLM_CHAT_TEMPLATE_KWARGS:-}
      # Pins the clock the studio stamps into every turn. Empty in production,
      # where the model should know the real time; set for a benchmark so two
      # runs of the same case send the same request instead of differing by a
      # minute and diverging from there.
      RUNTIME_CLOCK_ISO: ${RUNTIME_CLOCK_ISO:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Needed only for keys that are not scoped to a workspace; leave blank otherwise.
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MONGO_URI: mongodb://benchmark_run:${BENCHMARK_RUN_DB_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: benchmark_run
      BENCHMARK_REQUIRE_AUTH: "false"
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY}
      STUDIO_PUBLIC_URL: http://127.0.0.1:3511
      PANELS_PUBLIC_URL: http://127.0.0.1:3511
      PANEL_TOKEN_SECRET: ${PANEL_TOKEN_SECRET}
      PANEL_FRAME_ANCESTORS: http://127.0.0.1:3511
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_MAX_ORDER_NOTIONAL_USD: ${ALPACA_MAX_ORDER_NOTIONAL_USD:-500}
      ALPACA_MAX_ORDERS_PER_DAY: ${ALPACA_MAX_ORDERS_PER_DAY:-20}
      BENCHMARK_CONTEXT_DIR: /guidance
      ALPACA_KILL_SWITCH: /state/KILL
      ALPACA_FAULTS_FILE: /state/faults.json
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_SERVERS: '[{"applicationId":"benchmark-agent-studio","name":"tavily","endpoint":"https://mcp.tavily.com/mcp/","authType":"bearer","authValueEnvVar":"TAVILY_API_KEY"}]'
      # No email or messaging accounts here. The two editor tools only ask a browser to open a
      # panel; a headless benchmark has no browser, so calling one blocks until it times out.
      DISABLED_TOOLS: ${DISABLED_TOOLS:?set from the bench studio definition's sandbox.disabledTools}
    volumes:
      - ${RUN_STATE_DIR}:/state
      - ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}/profiles/benchmark/engine/src/context:/guidance:ro

networks:
  platform:
    external: true
