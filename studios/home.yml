# The agent studios on the `home` box (the NUC, which also runs Home Assistant
# OS as a VM): ONE shared agent-service hosting every studio type, plus one web
# front end per studio. Each studio's engine runs in its own runner container
# (home-runner, witness-runner; ADR-0117), which the service calls; the service
# reads each studio's public URL from its rendered deployment.json
# (studios/render-home-deployments.sh -> ~/agent-studio/home-deployments).
# One platform database (agent_studio in the shared Mongo), partitioned by each
# studio's applicationId; Witness also keeps its own collections (transactions,
# missions, life state, ...) in the `witness` DB.
# Secrets: ~/agent-studio/studios.env (setup-home.sh, plus each studio's keys).
#
# Studios, each at <name>.<STUDIOS_DOMAIN> (e.g. home.studio.example.com),
# served by caddy/:
#   Home Studio        home-agent-studio       home.
#   Witness            witness-agent-studio    witness.
#                                              connect. (Gmail/Drive OAuth, witness-runner)
#   shared agent-service                       api. (also the panels origin)
#
# Every studio web app is behind the domain's single sign-on (access/, checked by Caddy).
#
# Ports, all bound to 127.0.0.1 and reached through Caddy: agent-service 3001,
# Home Studio 3702, Witness 3703, witness-runner's inbound routes (Google OAuth)
# 8085, MCP server 3002 (public only through the Cloudflare tunnel). The runners'
# internal port (8790) is reached over the compose network only.
#
# Local models come from the inference box's shim (LOCAL_LLM_BASE_URL in
# studios.env, http://<inference box>:8091/v1). A 503 with retry-after from it
# means a model swap is in progress, not a failure.
#
# Run on the box after studios/setup-home.sh and studios/render-home-deployments.sh:
#   cd ~/agent-studio && docker compose -f ~/infra/studios/home.yml --env-file studios.env up -d --build

name: studios

services:
  agent-service:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: studios-agent-service:latest
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "127.0.0.1:3001:3001"
    networks: [default, platform]
    environment:
      NODE_ENV: production
      AGENT_SERVICE_PORT: "3001"
      LOG_LEVEL: info
      # The Investment Studio (benchmark-engine) is not here: it exists only for the
      # model bench, which starts its own throwaway copy per case (bench/, ADR-0020).
      # No engine loads in the service (ADR-0117): Home's and Witness's run in
      # home-runner and witness-runner below, which this service calls with
      # short-lived tokens signed by ENGINE_CALL_TOKEN_SIGNING_KEY (the runners
      # hold only the public half). Make the pair with
      # `npm run deploy:keygen -- --env` in the agent-studio checkout.
      PROFILES: ""
      REMOTE_ENGINES: home-agent-studio=http://home-runner:8790,witness-agent-studio=http://witness-runner:8790
      ENGINE_CALL_TOKEN_SIGNING_KEY: ${ENGINE_CALL_TOKEN_SIGNING_KEY}
      # The trusted hop (AS-0089): the web apps send it with the email the gate
      # verified, and the service believes that email only with it. Must match the
      # web apps' copy. Without it every REST call runs as the fallback user.
      STUDIO_HOP_KEY: ${STUDIO_HOP_KEY}
      DEPLOYMENTS_DIR: /deployments
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-5}
      ROUTER_MODEL: ${DEFAULT_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Other vendors models through OpenRouter (models with ids openrouter/...).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Decision model key (ADR-0033); tenant secret of the same name wins.
      DECISION_MODEL_API_KEY: ${DECISION_MODEL_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      # Qwen3.8's template defaults to reasoning_effort "xhigh" (about 2x wall
      # clock, and sometimes a blank reply at the token cap). Pin medium; a
      # request's own kwargs still win. The real levels are low, medium, xhigh.
      LOCAL_LLM_CHAT_TEMPLATE_KWARGS: '{"reasoning_effort":"medium"}'
      MONGO_URI: mongodb://agent_studio:${STUDIOS_DB_PASSWORD}@mongo:27017/?authSource=agent_studio
      MONGO_DB: agent_studio
      # Every studio's web origin (comma-separated for CORS, space-separated for frames).
      CORS_ORIGINS: https://home.${STUDIOS_DOMAIN},https://witness.${STUDIOS_DOMAIN},https://invest.${STUDIOS_DOMAIN}
      PANEL_FRAME_ANCESTORS: https://home.${STUDIOS_DOMAIN} https://witness.${STUDIOS_DOMAIN} https://invest.${STUDIOS_DOMAIN}
      PANELS_PUBLIC_URL: https://api.${STUDIOS_DOMAIN}
      PANEL_TOKEN_SECRET: ${PANEL_TOKEN_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY}
      # The default for anything without a deployment of its own; each studio's
      # real URL comes from its deployment.json.
      STUDIO_PUBLIC_URL: https://home.${STUDIOS_DOMAIN}
      # Where outside systems post into this box's notification threads (ADR-0054 §6):
      # the Cloudflare tunnel route inbound.<domain>, which passes only that route.
      INBOUND_PUBLIC_URL: ${INBOUND_PUBLIC_URL:-}
      # Product feedback (ADR-0053 §8): the PM studio and this box's reporting key.
      FEEDBACK_PM_URL: ${FEEDBACK_PM_URL:-}
      FEEDBACK_PM_KEY: ${FEEDBACK_PM_KEY:-}

      POSTMARK_API_KEY: ${POSTMARK_API_KEY}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL}
      POSTMARK_FROM_NAME: ${POSTMARK_FROM_NAME}
    volumes:
      - ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}/home-deployments:/deployments:ro
    depends_on:
      - home-runner
      - witness-runner

  # Home's engine runner (ADR-0117): Home's tools (Home Assistant, Spotify) and
  # session resolver, from the agent-service image. Home's settings live here,
  # not in the service. Only its internal port (8790) is used, over the compose
  # network; Home declares no inbound routes.
  home-runner:
    image: studios-agent-service:latest
    restart: unless-stopped
    mem_limit: 512m
    command: ["node", "packages/engine-runner/dist/main.js"]
    environment:
      NODE_ENV: production
      ENGINE_MODULE: "@agent-studio/home-engine"
      RUNNER_NAME: home-runner
      AGENT_SERVICE_URL: http://agent-service:3001
      ENGINE_CALL_TOKEN_PUBLIC_KEYS: ${ENGINE_CALL_TOKEN_PUBLIC_KEYS}
      RUNNER_INTERNAL_PORT: "8790"
      STUDIO_PUBLIC_URL: https://home.${STUDIOS_DOMAIN}
      HOME_REQUIRE_AUTH: "false"
      HOME_ADMIN_EMAILS: ${HOME_ADMIN_EMAILS:-}
      # A long-lived token for the "agent-studio" HA user (admin, not
      # local-only). Entities in HA_READONLY_ENTITIES are never changed.
      HA_BASE_URL: ${HA_BASE_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_READONLY_ENTITIES: ${HA_READONLY_ENTITIES:-}
      HA_TTS_ENTITY: ${HA_TTS_ENTITY:-}
      HA_TTS_VOICE: ${HA_TTS_VOICE:-}
      # Where Home Assistant sends webhook calls. The studio's own name works:
      # HA resolves it through public DNS to this box's tailnet IP.
      HA_WEBHOOK_BASE_URL: ${HA_WEBHOOK_BASE_URL:-https://home.${STUDIOS_DOMAIN}}
      # A Spotify developer app, for spotify_search: catalog search only.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}

  # Witness's engine runner (ADR-0117): Witness's tools, session resolver and its
  # Google data-access OAuth (inbound routes, served under /engine-inbound/witness
  # on port 8791). The inbound port is published on 127.0.0.1:8085, the retired
  # callback service's port, where Caddy's connect.<STUDIOS_DOMAIN> route goes; Caddy
  # adds the /engine-inbound/witness prefix, so the URLs Google knows
  # (https://connect.<STUDIOS_DOMAIN>/oauth/google/{start,callback}) are unchanged.
  witness-runner:
    image: studios-agent-service:latest
    restart: unless-stopped
    mem_limit: 768m
    command: ["node", "packages/engine-runner/dist/main.js"]
    ports:
      - "127.0.0.1:8085:8791"
    networks: [default, platform]
    environment:
      NODE_ENV: production
      ENGINE_MODULE: "@agent-studio/witness-engine"
      RUNNER_NAME: witness-runner
      AGENT_SERVICE_URL: http://agent-service:3001
      ENGINE_CALL_TOKEN_PUBLIC_KEYS: ${ENGINE_CALL_TOKEN_PUBLIC_KEYS}
      RUNNER_INTERNAL_PORT: "8790"
      RUNNER_INBOUND_PORT: "8791"
      RUNNER_INBOUND_PREFIX: /engine-inbound/witness
      STUDIO_PUBLIC_URL: https://witness.${STUDIOS_DOMAIN}
      WITNESS_REQUIRE_AUTH: "false"
      WITNESS_MONGO_URI: mongodb://witness:${WITNESS_DB_PASSWORD}@mongo:27017/witness?authSource=witness
      # Witness's own key for its Google tokens, never SECRETS_ENCRYPTION_KEY.
      WITNESS_TOKEN_ENCRYPTION_KEY: ${WITNESS_TOKEN_ENCRYPTION_KEY}
      # The base Google sees; Caddy maps it onto the runner's inbound prefix.
      WITNESS_OAUTH_EDGE_URL: https://connect.${STUDIOS_DOMAIN}
      WITNESS_ADMIN_EMAILS: ${WITNESS_ADMIN_EMAILS}
      WITNESS_PAYOUT_FORWARDERS: ${WITNESS_PAYOUT_FORWARDERS:-}
      # Transaction model v2: "1" keeps a still-running v1 agent working during the
      # cutover. Unset it once the v2 migration has been applied.
      WITNESS_V2_COMPAT: ${WITNESS_V2_COMPAT:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN}

  home-studio-web:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/studio-web/Dockerfile
      args:
        APP_PROFILE: home
        NEXT_PUBLIC_AGENT_SERVICE_URL: https://api.${STUDIOS_DOMAIN}
        NEXT_PUBLIC_AUTH_ENABLED: "false"
        NEXT_PUBLIC_APPLICATION_ID: home-agent-studio
        # The public MCP address shown for this studio's MCP servers (the tunnel's
        # hostname), e.g. https://mcp.example.com -> <it>/mcp/servers/<id>.
        NEXT_PUBLIC_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
        NEXT_PUBLIC_BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: home-studio-web:latest
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:3702:3000"
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent-service:3001
      # Caddy's forward_auth passes oauth2-proxy's verified email here (and strips any
      # client-sent copy), so server-side routes like /panel/<id> know the viewer.
      AUTH_PROXY_EMAIL_HEADER: X-Auth-Request-Email
      # The same STUDIO_HOP_KEY as the agent-service's (AS-0089).
      STUDIO_HOP_KEY: ${STUDIO_HOP_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://home.${STUDIOS_DOMAIN}
    depends_on:
      - agent-service

  witness-web:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/studio-web/Dockerfile
      args:
        APP_PROFILE: witness
        NEXT_PUBLIC_AGENT_SERVICE_URL: https://api.${STUDIOS_DOMAIN}
        NEXT_PUBLIC_AUTH_ENABLED: "false"
        NEXT_PUBLIC_APPLICATION_ID: witness-agent-studio
        # The public MCP address shown for this studio's MCP servers (the tunnel's
        # hostname), e.g. https://mcp.example.com -> <it>/mcp/servers/<id>.
        NEXT_PUBLIC_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
        NEXT_PUBLIC_BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: witness-web:latest
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:3703:3000"
    # The alias keeps the name the Witness stack has always used for its web app.
    networks:
      default:
        aliases: [studio-web]
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent-service:3001
      # Caddy's forward_auth passes oauth2-proxy's verified email here (and strips any
      # client-sent copy), so server-side routes like /panel/<id> know the viewer.
      AUTH_PROXY_EMAIL_HEADER: X-Auth-Request-Email
      # The same STUDIO_HOP_KEY as the agent-service's (AS-0089).
      STUDIO_HOP_KEY: ${STUDIO_HOP_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://witness.${STUDIOS_DOMAIN}
    depends_on:
      - agent-service

  mcp-server:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/mcp-server/Dockerfile
    image: studios-mcp-server:latest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      MCP_SERVER_PORT: "3002"
      LOG_LEVEL: info
      AGENT_SERVICE_INTERNAL_URL: http://agent-service:3001
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY}
    depends_on:
      - agent-service

  # Only ONE copy of this may run (the tunnel token is the identity): stop it
  # wherever it ran before starting it here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mcp-server

networks:
  default: {}
  platform:
    external: true
