# The agent studios on the `home` box (the NUC, which also runs Home Assistant
# OS as a VM): ONE shared agent-service hosting every studio type, plus one web
# front end per studio. The service loads each studio's engine (PROFILES) and
# reads each studio's public URL from its rendered deployment.json
# (studios/render-home-deployments.sh -> ~/agent-studio/home-deployments).
# One platform database (agent_studio in the shared Mongo), partitioned by each
# studio's applicationId; Witness also keeps its own collections (transactions,
# missions, life state, ...) in the `witness` DB.
# Secrets: ~/agent-studio/studios.env (setup-home.sh, plus each studio's keys).
#
# Studios, each at <name>.<STUDIOS_DOMAIN> (e.g. home.studio.example.com),
# served by caddy/:
#   Home Studio        home-agent-studio       home.
#   Witness            witness-agent-studio    witness. (Google login via oauth2-proxy)
#                                              connect. (Gmail/Drive OAuth callback)
#   Investment Studio  benchmark-agent-studio  invest.
#   shared agent-service                       api. (also the panels origin)
#
# Ports, all bound to 127.0.0.1 and reached through Caddy: agent-service 3001,
# Home Studio 3702, Witness login 4180, Witness OAuth 8085, Investment 3704,
# MCP server 3002 (public only through the Cloudflare tunnel).
#
# Local models come from the inference box's shim (LOCAL_LLM_BASE_URL in
# studios.env, http://<inference box>:8091/v1). A 503 with retry-after from it
# means a model swap is in progress, not a failure.
#
# Run on the box after studios/setup-home.sh and studios/render-home-deployments.sh:
#   cd ~/agent-studio && docker compose -f ~/infra/studios/home.yml --env-file studios.env up -d --build

name: studios

services:
  agent-service:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: studios-agent-service:latest
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "127.0.0.1:3001:3001"
    networks: [default, platform]
    environment:
      NODE_ENV: production
      AGENT_SERVICE_PORT: "3001"
      LOG_LEVEL: info
      PROFILES: "@agent-studio/home-engine,@agent-studio/witness-engine,@agent-studio/benchmark-engine"
      DEPLOYMENTS_DIR: /deployments
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-5}
      ROUTER_MODEL: ${DEFAULT_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      # Qwen3.8's template defaults to reasoning_effort "xhigh" (about 2x wall
      # clock, and sometimes a blank reply at the token cap). Pin medium; a
      # request's own kwargs still win. The real levels are low, medium, xhigh.
      LOCAL_LLM_CHAT_TEMPLATE_KWARGS: '{"reasoning_effort":"medium"}'
      MONGO_URI: mongodb://agent_studio:${STUDIOS_DB_PASSWORD}@mongo:27017/?authSource=agent_studio
      MONGO_DB: agent_studio
      # Every studio's web origin (comma-separated for CORS, space-separated for frames).
      CORS_ORIGINS: https://home.${STUDIOS_DOMAIN},https://witness.${STUDIOS_DOMAIN},https://invest.${STUDIOS_DOMAIN}
      PANEL_FRAME_ANCESTORS: https://home.${STUDIOS_DOMAIN} https://witness.${STUDIOS_DOMAIN} https://invest.${STUDIOS_DOMAIN}
      PANELS_PUBLIC_URL: https://api.${STUDIOS_DOMAIN}
      PANEL_TOKEN_SECRET: ${PANEL_TOKEN_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY}
      # The default for anything without a deployment of its own; each studio's
      # real URL comes from its deployment.json.
      STUDIO_PUBLIC_URL: https://home.${STUDIOS_DOMAIN}

      # --- Home Studio engine ---------------------------------------------
      HOME_REQUIRE_AUTH: "false"
      HOME_ADMIN_EMAILS: ${HOME_ADMIN_EMAILS:-}
      # A long-lived token for the "agent-studio" HA user (admin, not
      # local-only). Entities in HA_READONLY_ENTITIES are never changed.
      HA_BASE_URL: ${HA_BASE_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_READONLY_ENTITIES: ${HA_READONLY_ENTITIES:-}
      # Where Home Assistant sends webhook calls. The studio's own name works:
      # HA resolves it through public DNS to this box's tailnet IP.
      HA_WEBHOOK_BASE_URL: ${HA_WEBHOOK_BASE_URL:-https://home.${STUDIOS_DOMAIN}}

      # --- Witness engine -------------------------------------------------
      WITNESS_REQUIRE_AUTH: "false"
      WITNESS_MONGO_URI: mongodb://witness:${WITNESS_DB_PASSWORD}@mongo:27017/witness?authSource=witness
      WITNESS_TOKEN_ENCRYPTION_KEY: ${WITNESS_TOKEN_ENCRYPTION_KEY}
      WITNESS_OAUTH_EDGE_URL: https://connect.${STUDIOS_DOMAIN}
      WITNESS_ADMIN_EMAILS: ${WITNESS_ADMIN_EMAILS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL}
      POSTMARK_FROM_NAME: ${POSTMARK_FROM_NAME}

      # --- Investment Studio engine (benchmark-engine) --------------------
      BENCHMARK_REQUIRE_AUTH: "false"
      BENCHMARK_ADMIN_EMAILS: ${BENCHMARK_ADMIN_EMAILS:-}
      # Alpaca PAPER only. The tools refuse every other host, whatever these say.
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_MAX_ORDER_NOTIONAL_USD: ${ALPACA_MAX_ORDER_NOTIONAL_USD:-500}
      ALPACA_MAX_ORDERS_PER_DAY: ${ALPACA_MAX_ORDERS_PER_DAY:-20}
      BENCHMARK_CONTEXT_DIR: /guidance
      ALPACA_KILL_SWITCH: /state/KILL
      ALPACA_FAULTS_FILE: /state/faults.json
      # Internet research (Tavily), seeded as an MCP server for the Investment
      # Studio; the key is read from TAVILY_API_KEY, never written here.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_SERVERS: '[{"applicationId":"benchmark-agent-studio","name":"tavily","endpoint":"https://mcp.tavily.com/mcp/","authType":"bearer","authValueEnvVar":"TAVILY_API_KEY"}]'
    volumes:
      - ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}/home-deployments:/deployments:ro
      # Investment Studio: its router guidance (read from the checkout, so tuning
      # is an edit plus a restart), and its kill switch / scripted faults.
      - ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}/profiles/benchmark/engine/src/context:/guidance:ro
      - ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}/benchmark-state:/state

  home-studio-web:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/studio-web/Dockerfile
      args:
        APP_PROFILE: home
        NEXT_PUBLIC_AGENT_SERVICE_URL: https://api.${STUDIOS_DOMAIN}
        NEXT_PUBLIC_AUTH_ENABLED: "false"
        NEXT_PUBLIC_APPLICATION_ID: home-agent-studio
        NEXT_PUBLIC_BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: home-studio-web:latest
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:3702:3000"
      # Home Assistant's webhook calls, straight on this box's tailnet IP (so only
      # the tailnet can reach it). Not via `tailscale serve`: that routes by
      # hostname, and HA can only use the IP. Needs net.ipv4.ip_nonlocal_bind=1
      # so the port binds at boot even before tailscale has the address.
      - "${STUDIOS_TAILNET_IP}:8743:3000"
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent-service:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://home.${STUDIOS_DOMAIN}
    depends_on:
      - agent-service

  witness-web:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/studio-web/Dockerfile
      args:
        APP_PROFILE: witness
        NEXT_PUBLIC_AGENT_SERVICE_URL: https://api.${STUDIOS_DOMAIN}
        NEXT_PUBLIC_AUTH_ENABLED: "false"
        NEXT_PUBLIC_APPLICATION_ID: witness-agent-studio
        NEXT_PUBLIC_BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: witness-web:latest
    restart: unless-stopped
    mem_limit: 1g
    # Only reachable through oauth2-proxy (no published port). The alias keeps
    # the name the Witness stack has always used for its web app.
    networks:
      default:
        aliases: [studio-web]
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent-service:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://witness.${STUDIOS_DOMAIN}
    depends_on:
      - agent-service

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${WITNESS_LOGIN_GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${WITNESS_LOGIN_GOOGLE_CLIENT_SECRET}
      # Must be an authorised redirect URI on the Google login client (Console).
      OAUTH2_PROXY_REDIRECT_URL: https://witness.${STUDIOS_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://witness-web:3000
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAIN: "*"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      - ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}/oauth2-proxy-emails.txt:/etc/oauth2-proxy/emails.txt:ro
    depends_on:
      - witness-web

  witness-oauth-callback:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: profiles/witness/oauth-callback/Dockerfile
    image: witness-oauth-callback:latest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:8085:8080"
    networks: [default, platform]
    environment:
      PORT: "8080"
      WITNESS_MONGO_URI: mongodb://witness:${WITNESS_DB_PASSWORD}@mongo:27017/witness?authSource=witness
      WITNESS_TOKEN_ENCRYPTION_KEY: ${WITNESS_TOKEN_ENCRYPTION_KEY}
      # Must be an authorised redirect URI (+ /oauth/google/callback) on the
      # Google connection client (Console).
      WITNESS_OAUTH_EDGE_URL: https://connect.${STUDIOS_DOMAIN}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}

  investment-web:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/studio-web/Dockerfile
      args:
        APP_PROFILE: benchmark
        NEXT_PUBLIC_AGENT_SERVICE_URL: https://api.${STUDIOS_DOMAIN}
        NEXT_PUBLIC_AUTH_ENABLED: "false"
        NEXT_PUBLIC_APPLICATION_ID: benchmark-agent-studio
        NEXT_PUBLIC_BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: investment-web:latest
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:3704:3000"
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent-service:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://invest.${STUDIOS_DOMAIN}
    depends_on:
      - agent-service

  # The studios' MCP server surface (ADR-0005), reached from outside through
  # the Cloudflare tunnel.
  mcp-server:
    build:
      context: ${AGENT_STUDIO_DIR:-${HOME}/agent-studio}
      dockerfile: apps/mcp-server/Dockerfile
    image: studios-mcp-server:latest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      MCP_SERVER_PORT: "3002"
      LOG_LEVEL: info
      AGENT_SERVICE_INTERNAL_URL: http://agent-service:3001
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY}
    depends_on:
      - agent-service

  # Only ONE copy of this may run (the tunnel token is the identity): stop it
  # wherever it ran before starting it here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mcp-server

networks:
  default: {}
  platform:
    external: true
