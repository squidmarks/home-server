# Standalone Mongo for every app on this box. No published ports: reachable
# only on the docker "platform" network as mongo:27017. Auth is on.
# GLIBC_TUNABLES works around MongoDB 8.0 crashing on kernels 6.19+ (SERVER-121912).
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    # WiredTiger keeps a file per collection and index, plus one per connection.
    # Docker here defaults containers to a soft limit of 1024 open files, and a
    # database restore exhausted it: mongod crashed (errno 24, EMFILE) and left the
    # container hung. Verified 2026-09-20; do not lower this.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data:/data/db
    networks: [platform]
networks:
  platform:
    external: true
