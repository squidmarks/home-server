# Path routing for the server, the same shape becoming-hub uses: one hostname,
# a path per service, no ports to remember. http://server/llm/ and so on from
# any tailnet device.
#
# Each service keeps its own tailscale serve port as well (tailscale/serve.sh);
# this is an easier front door, not a replacement. Trailing slashes matter on
# BOTH sides of proxy_pass: with them nginx strips the prefix, so the service
# sees "/admin/status" rather than "/llm/admin/status" and needs no knowledge of
# where it is mounted.
server {
    listen 80;
    server_name server server.local;

    # Long-running agent requests: a local model can think for minutes before a
    # first token, and the default 60s would cut them off mid-answer.
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # This box is the inference box: its front door is its own config page. The
    # tailnet home page (links to everything) lives on the home box.
    location = / { return 302 /llm/admin/; }

    # Bare /llm goes to the page a person wants, so the short name is enough.
    location = /llm { return 302 /llm/admin/; }
    location = /llm/ { return 302 /llm/admin/; }

    location /llm/ {
        proxy_pass http://127.0.0.1:8091/;
        include /etc/nginx/snippets/server-proxy.conf;
        # Streamed tokens must not sit in a buffer waiting to be flushed.
        proxy_buffering off;
        proxy_cache off;
    }

    location /bench/ {
        proxy_pass http://127.0.0.1:3400/;
        include /etc/nginx/snippets/server-proxy.conf;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        include /etc/nginx/snippets/server-proxy.conf;
    }

    location /mongo/ {
        proxy_pass http://127.0.0.1:3110/;
        include /etc/nginx/snippets/server-proxy.conf;
    }
}
