# Monitoring, on home: Prometheus + Grafana with exporters for both boxes
# (host, GPU, containers), MongoDB and Agent Studio. The inference box runs only
# docker-compose.exporters.yml; Prometheus here scrapes it over the tailnet.
#
# Everything binds to 127.0.0.1; Caddy publishes Grafana as grafana.<domain>.
# Add a capability by adding a scrape job in prometheus/prometheus.yml and a
# panel in grafana/gen_dashboards.py.
#
# Run from ~/infra/monitoring:  ./setup.sh && docker compose -f docker-compose.monitoring.yml up -d --build
include:
  - docker-compose.exporters.yml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      # A directory, not a single file: editors/rsync replace files (new inode), which a
      # single-file bind mount would never see.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [platform]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Tailnet is the trust boundary (same as the rest of these boxes), so
      # viewing is open to any tailnet device; editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [platform]
    depends_on: [prometheus]


  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://monitor:${MONGO_MONITOR_PASSWORD}@mongo:27017/admin
      - --collect-all
      - --compatible-mode
    networks: [platform]

  studio-exporter:
    build: ./studio-exporter
    container_name: studio-exporter
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://metrics:${STUDIO_METRICS_PASSWORD}@mongo:27017/agent_studio?authSource=admin
      MONGO_DB: agent_studio # the platform: requests, sessions, agents, jobs
      DOMAIN_DB: witness # Witness's own collections (missions, transactions, ...)
    networks: [platform]

volumes:
  prometheus-data:
  grafana-data:

networks:
  platform:
    external: true
