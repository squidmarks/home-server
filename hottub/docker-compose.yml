# The hot tub web app (code in the hottub-firmware repo, webapp/, synced to
# ~/hottub/webapp by ../sync-hottub.sh). Its /admin pages are behind the
# domain's single sign-on (Caddy `gate`, rule "hottub-admin" on access.<domain>).
#
# Published by Caddy at hottub.<domain> on BOTH the tailnet IP and the LAN IP,
# so guests on the home Wi-Fi reach it without Tailscale (the DNS record for
# hottub.<domain> points at the LAN IP; tailnet devices away from home get
# there through home's subnet route). Everything here binds 127.0.0.1.
#
# Settings live in a gitignored hottub/.env (compose reads it automatically):
#   CONTROLLER_HOST=             the tub controller's LAN address (DHCP-reserved)
#   CONTROLLER_API_KEY=          its ESPHome api_encryption_key
#   ADMIN_EMAILS=                leave empty: who is admin is decided on access.<domain>
#                                (set it only to narrow that further)
# Run from ~/infra/hottub:  docker compose up -d --build
name: hottub

services:
  web:
    build: ${HOTTUB_APP_DIR:-${HOME}/hottub/webapp}
    image: hottub-web:latest
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:3500:3500"
    environment:
      CONTROLLER_HOST: ${CONTROLLER_HOST}
      CONTROLLER_API_KEY: ${CONTROLLER_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      # Temperature history (SQLite, 1-minute samples, 60 days). Gitignored.
      - ./data:/data
