# The hot tub web app (code in the hottub-firmware repo, webapp/, synced to
# ~/hottub/webapp by ../sync-hottub.sh) and its own Google login for /admin.
#
# Published by Caddy at hottub.<domain> on BOTH the tailnet IP and the LAN IP,
# so guests on the home Wi-Fi reach it without Tailscale (the DNS record for
# hottub.<domain> points at the LAN IP; tailnet devices away from home get
# there through home's subnet route). Everything here binds 127.0.0.1.
#
# Settings live in a gitignored hottub/.env (compose reads it automatically):
#   CONTROLLER_HOST=             the tub controller's LAN address (DHCP-reserved)
#   CONTROLLER_API_KEY=          its ESPHome api_encryption_key
#   ADMIN_EMAILS=                comma-separated admin emails
#   DOMAIN=                      the domain (same as caddy/.env)
#   GOOGLE_CLIENT_ID=            a Google OAuth client with
#   GOOGLE_CLIENT_SECRET=          https://hottub.<domain>/oauth2/callback as a redirect URI
#   OAUTH2_PROXY_COOKIE_SECRET=  32 random bytes, base64url
# Run from ~/infra/hottub:  docker compose up -d --build
name: hottub

services:
  web:
    build: ${HOTTUB_APP_DIR:-${HOME}/hottub/webapp}
    image: hottub-web:latest
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:3500:3500"
    environment:
      CONTROLLER_HOST: ${CONTROLLER_HOST}
      CONTROLLER_API_KEY: ${CONTROLLER_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}

  # Admin login only (Caddy asks it via forward_auth for /admin and
  # /api/admin/*); the guest page has no login.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "127.0.0.1:4181:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://hottub.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_NAME: _hottub_admin
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: hottub.${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: hottub.${DOMAIN}
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_EMAIL_DOMAIN: "*"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # One admin email per line (gitignored; written by setup from ADMIN_EMAILS).
      - ./admin-emails.txt:/etc/oauth2-proxy/emails.txt:ro
